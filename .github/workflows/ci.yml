name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        # PortAudio is required by `sounddevice` (used by audio_generator)
        # for playback in tests. Without it pytest collection fails on
        # 28 tests that transitively import core.audio_generator.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 \
            libsndfile1 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-minimal.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        # tests/e2e/ requires running services (LM Studio, PostgreSQL, etc.)
        # and is excluded from CI. Developers can run them locally with
        # 'pytest tests/e2e/ -m "not slow"'.
        # pipefail so a pytest failure is not hidden by tail's exit 0.
        run: |
          set -o pipefail
          pytest tests/ -m "not slow" --ignore=tests/e2e --tb=short -v --cov --cov-report=term-missing 2>&1 | tail -n 200

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test
